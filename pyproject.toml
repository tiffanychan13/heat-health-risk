[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatrisk"
version = "0.1.0"
description = "NYC heat-related ED-visit risk prediction and heat-response activation decision rule"
requires-python = ">=3.10"
authors = [{ name = "Tiffany Chan" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
